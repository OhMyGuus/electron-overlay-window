name: Prebuild

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build prebuilds
        run: npm run prebuild

      - name: Build ia32 prebuilds (Windows)
        if: runner.os == 'Windows'
        run: npm run prebuild:ia32

      - name: Upload prebuilds
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.platform }}
          path: prebuilds
          if-no-files-found: error

  commit:
    needs: prebuild
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds

      - name: Commit prebuilds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f prebuilds
          if git diff --cached --quiet; then
            echo "No changes to prebuilds"
          else
            git commit -m "chore: update prebuilds [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Move release tag to include prebuilds
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git tag -f "$GITHUB_REF_NAME" HEAD
          git push origin "$GITHUB_REF_NAME" --force

  release:
    needs: commit
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds

      - name: Archive prebuilds
        run: tar -czf prebuilds.tar.gz -C prebuilds .

      - name: Attach prebuilds to release
        uses: softprops/action-gh-release@v3
        with:
          files: prebuilds.tar.gz
